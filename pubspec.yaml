name: bitzlatoview_mobile
description: Native Flutter client for the Bitzlatoview platform with WebView, push notifications, biometrics, and deep linking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^15.1.2

  # WebView
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.22.0
  webview_cookie_manager_plus: ^2.0.17

  # Storage & session
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Push notifications
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9
  flutter_local_notifications: ^19.3.0

  # Native features
  file_picker: ^10.2.0
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  geolocator: ^14.0.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  permission_handler: ^12.0.0+1
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0

  # Connectivity & deep links
  connectivity_plus: ^6.1.4
  app_links: ^6.4.0

  # UI
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#0A0A0A"
  color_dark: "#0A0A0A"
  android: true
  ios: true
  android_12:
    color: "#0A0A0A"
    icon_background_color: "#0A0A0A"
