name: bitzlatoview_mobile
description: Bitzlatoview Mobile – native Flutter client for the Bitzlatoview fintech platform.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  flutter_inappwebview: ^6.1.5
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.4
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  webview_cookie_manager_plus: ^2.0.17
  file_picker: ^8.3.7
  camera: ^0.11.1
  local_auth: ^2.3.0
  app_links: ^6.4.0
  pull_to_refresh: ^2.0.0
  connectivity_plus: ^6.1.3
  share_plus: ^10.1.4
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3
  mockito: ^5.4.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/icon-512x512.png
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: assets/icons/icon-512x512.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B0F1A"
  image: assets/icons/icon-384x384.png
  android_12:
    color: "#0B0F1A"
    image: assets/icons/icon-384x384.png
